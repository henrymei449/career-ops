<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareerOps Operator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
  header { background: #1c2b3a; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; background: #fff; border-bottom: 1px solid #ddd; }
  nav button { border: none; background: none; padding: 10px 16px; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; color: #555; }
  nav button.active { color: #1c2b3a; border-bottom-color: #1c2b3a; font-weight: 600; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 8px; }
  .reason { font-size: 13px; color: #333; background: #f8f9fa; border-radius: 4px; padding: 8px; margin-bottom: 10px; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.action { border: 1px solid #ccc; background: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button.action:hover { background: #f0f1f3; }
  button.primary { background: #1c2b3a; color: #fff; border-color: #1c2b3a; }
  button.primary:hover { background: #2c3e50; }
  button.action.selected { background: #1c2b3a; color: #fff; border-color: #1c2b3a; }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-pill { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  .status-ACTIVE { background: #e3f6e8; color: #1a7d3a; }
  .status-STALE { background: #fff4d9; color: #8a6300; }
  .status-REJECTED, .status-WITHDRAWN { background: #fbe4e4; color: #a01c1c; }
  .status-CLOSED { background: #eee; color: #555; }
  .status-UNKNOWN { background: #eef1f4; color: #555; }
  .empty { color: #888; font-style: italic; padding: 20px 0; }
  .err { color: #b00020; font-size: 13px; margin-top: 6px; }
  .toolbar { margin-bottom: 14px; }
  select#batch-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; min-width: 320px; }
  .lane-title { font-size: 12px; text-transform: uppercase; color: #888; margin: 10px 0 4px; }
  .candidate { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .candidate:last-child { border-bottom: none; }
  .candidate label { flex: 1; cursor: pointer; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #eef1f4; color: #444; margin-left: 6px; }
  a { color: #1c5fb4; }
  .fu-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #ddd; border-radius: 6px; padding: 6px 12px; font-size: 13px; background: #fff; font-family: inherit; cursor: pointer; }
  .fu-chip:hover { background: #f0f1f3; }
  .fu-chip.selected { border-color: #1c2b3a; box-shadow: inset 0 0 0 1px #1c2b3a; }
  .fu-chip b { font-size: 15px; }
  .fu-chip.overdue b { color: #a01c1c; }
  .fu-chip.today b { color: #8a6300; }
  .fu-chip.upcoming b { color: #1c5fb4; }
  .fu-chip.waiting b { color: #555; }
  .fu-operating input[type="text"], .fu-operating input[type="date"] { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; width: 100%; }
  .fu-operating select { padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
  .fu-operating .fu-detail-grid { grid-template-columns: repeat(2, minmax(200px, 1fr)); }
  table.fu-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; overflow: hidden; font-size: 13px; table-layout: fixed; }
  table.fu-table th { text-align: left; padding: 8px 10px; background: #f5f6f8; border-bottom: 1px solid #e1e4e8; font-size: 11px; text-transform: uppercase; color: #666; white-space: normal; line-height: 1.3; }
  table.fu-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.fu-table tr.fu-row { cursor: pointer; }
  table.fu-table tr.fu-row:hover { background: #f8f9fa; }
  .fu-due-OVERDUE { color: #a01c1c; font-weight: 600; }
  .fu-due-TODAY { color: #8a6300; font-weight: 600; }
  .fu-due-UPCOMING { color: #1c5fb4; }
  .fu-due-WAITING { color: #888; font-style: italic; }
  .fu-status-ACTION-DUE { color: #a01c1c; font-weight: 600; }
  .fu-status-WAITING { color: #555; }
  .fu-status-STALE { color: #8a6300; font-weight: 600; }
  tr.fu-detail td { background: #f8f9fa; padding: 14px 18px; white-space: normal; }
  .fu-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 4px 24px; margin-bottom: 10px; font-size: 13px; }
  .fu-detail-grid div span { color: #888; margin-right: 4px; }
  /* Expanded Home card: header (identity + compact stage/priority) -> status
     line -> action block (Next Action / Follow-Up Due / Waiting On) ->
     context block (Last Touch / Notes). Normalizes control sizing so no
     single field (esp. Stage/Priority) visually dominates the card. */
  .fu-card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .fu-card-title { font-size: 14px; font-weight: 600; color: #1c1e21; }
  .fu-card-badges { display: flex; gap: 14px; align-items: center; }
  .fu-card-badge { display: flex; gap: 6px; align-items: center; }
  .fu-card-badge span { font-size: 11px; text-transform: uppercase; color: #888; }
  .fu-card-status { font-size: 12px; color: #666; margin-bottom: 10px; }
  .fu-card-divider { border-top: 1px solid #e1e4e8; margin: 12px 0; }
  .fu-block-label { font-size: 11px; text-transform: uppercase; color: #888; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.02em; }
  .fu-field-group { margin-bottom: 10px; }
  .fu-field, .fu-field-select { font-size: 13px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; height: 32px; box-sizing: border-box; font-family: inherit; }
  input.fu-field { width: 100%; }
  .fu-followup-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  /* Zebra striping (Home UI correction, section 6): a subtle alternation on
     collapsed opportunity rows only, keyed by job index so the sequence
     survives filtering/sorting and doesn't drift when a row's detail
     (`tr.fu-detail`) is inserted between opportunities. */
  tr.fu-row.fu-stripe { background: #eef4fb; }
  tr.fu-row.fu-stripe:hover { background: #e2edf9; }
  .card.highlight { outline: 2px solid #1c5fb4; outline-offset: 2px; }
  .status-form { margin-top: 10px; padding: 12px; background: #f8f9fa; border-radius: 4px; }
  .status-form .row { margin-bottom: 8px; }
  .status-form label { font-size: 12px; color: #666; width: 90px; flex-shrink: 0; }
  .status-form select, .status-form input[type="date"] { padding: 6px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
  .status-form textarea { flex: 1; min-width: 220px; padding: 6px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; font-family: inherit; }
  .gate { border: 1px solid #dfe3e8; border-left: 4px solid #6b7c93; border-radius: 4px; padding: 8px 10px; margin-bottom: 10px; font-size: 13px; background: #fbfcfd; }
  .gate.gate-warn { border-left-color: #c77700; background: #fff9ec; }
  .gate.gate-blocked { border-left-color: #999; background: #f4f4f4; color: #555; }
  .gate.gate-error { border-left-color: #b3261e; background: #fdf1f0; }
  .gate { overflow-wrap: anywhere; min-width: 0; }
  .gate .gate-head { font-weight: 700; margin-bottom: 4px; }
  .gate .gate-label { font-weight: 700; color: #1c2b3a; }
  .gate .gate-top { font-size: 15px; margin-bottom: 4px; }
  .gate .gate-value { font-weight: 800; letter-spacing: 0.2px; }
  .gate .gate-meta { font-size: 12px; color: #667; margin-bottom: 6px; }
  .gate .gate-meta-label { font-weight: 600; }
  .gate .gate-block .gate-label { font-size: 11px; letter-spacing: 0.5px; }
  .gate .gate-block { margin: 6px 0; }
  .gate .gate-text { font-weight: 400; line-height: 1.4; white-space: normal; }
  .gate .gate-stale { color: #8a6300; font-weight: 600; margin-left: 6px; }
  .gate details { margin-top: 6px; }
  .gate details summary { cursor: pointer; color: #1c5fb4; }
  .gate pre.gate-full { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; padding: 8px; background: #f4f6f8; border-radius: 4px; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  .completion-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 8px; background: #eef1f4; color: #444; }
  .completion-COMPLETE { background: #e3f6e8; color: #1a7d3a; }
  .completion-IN_PROGRESS { background: #fff4d9; color: #8a6300; }
</style>
</head>
<body>
<header>
  <h1>CareerOps Operator</h1>
</header>
<nav>
  <button data-view="followup" class="active">Home</button>
  <button data-view="review">Review</button>
  <button data-view="ready">Ready to Apply</button>
  <button data-view="applications">Applications</button>
  <button data-view="outreach">Outreach</button>
</nav>
<main>
  <section id="view-review">
    <div class="toolbar row">
      <button class="action" id="add-job-btn">Add Job</button>
      <input type="url" id="add-job-url" placeholder="https://... job posting URL" style="display:none; flex: 1; min-width: 260px; padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
      <button class="action primary" id="add-job-submit" style="display:none">Intake</button>
      <span id="add-job-status" class="meta"></span>
      <button class="action" id="li-paste-btn">Paste LinkedIn Results</button>
    </div>
    <div id="li-paste-panel" class="card" style="display:none">
      <div class="row">
        <input type="text" id="li-paste-query" placeholder="LinkedIn search query" style="flex: 1; min-width: 220px; padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
        <label class="meta" for="li-paste-captured">Captured</label>
        <input type="datetime-local" id="li-paste-captured" style="padding: 5px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
      </div>
      <textarea id="li-paste-text" rows="10" placeholder="Select all on each LinkedIn results page, copy, and paste here. Several pages can be pasted one after another." style="width: 100%; box-sizing: border-box; margin: 8px 0; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font: 12px/1.4 ui-monospace, Consolas, monospace;"></textarea>
      <div class="row">
        <label class="meta"><input type="checkbox" id="li-paste-online" checked disabled> Resolve links and JDs automatically; uncertainty goes to retry</label>
        <button class="action primary" id="li-paste-submit">Qualify for Review</button>
        <span id="li-paste-status" class="meta"></span>
      </div>
      <div id="li-paste-receipt"></div>
    </div>
    <div class="toolbar row">
      <label for="batch-select" class="meta">Review Batch:</label>
      <select id="batch-select"></select>
    </div>
    <div class="toolbar row">
      <button class="action primary" id="finalize-btn" disabled>Finalize Batch</button>
      <span id="finalize-hint" class="meta"></span>
    </div>
    <div class="toolbar row">
      <button class="action" id="gate-run-btn" disabled>Run Resume Gate</button>
      <button class="action" id="gate-force-btn" disabled title="Re-run every job in this batch even if its result is current">Re-run all</button>
      <span id="gate-hint" class="meta"></span>
    </div>
    <div id="review-list"></div>
  </section>

  <section id="view-ready">
    <div id="ready-list"></div>
  </section>

  <section id="view-applications">
    <div class="toolbar row">
      <button class="action selected" data-app-filter="alive" id="app-filter-alive">Alive</button>
      <button class="action" data-app-filter="all" id="app-filter-all">All</button>
      <button class="action" data-app-filter="closed" id="app-filter-closed">Closed</button>
    </div>
    <div id="applications-list"></div>
  </section>

  <section id="view-outreach">
    <div id="outreach-list"></div>
  </section>

  <section id="view-followup" class="active">
    <div class="row" id="followup-counts" style="margin-bottom:14px"></div>
    <div id="followup-list"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
