<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CareerOps Operator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
  header { background: #1c2b3a; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; background: #fff; border-bottom: 1px solid #ddd; }
  nav button { border: none; background: none; padding: 10px 16px; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent; color: #555; }
  nav button.active { color: #1c2b3a; border-bottom-color: #1c2b3a; font-weight: 600; }
  main { padding: 20px; max-width: 1100px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  .card { background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .meta { color: #666; font-size: 13px; margin-bottom: 8px; }
  .reason { font-size: 13px; color: #333; background: #f8f9fa; border-radius: 4px; padding: 8px; margin-bottom: 10px; white-space: pre-wrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button.action { border: 1px solid #ccc; background: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button.action:hover { background: #f0f1f3; }
  button.primary { background: #1c2b3a; color: #fff; border-color: #1c2b3a; }
  button.primary:hover { background: #2c3e50; }
  button.action.selected { background: #1c2b3a; color: #fff; border-color: #1c2b3a; }
  button.action:disabled { opacity: 0.5; cursor: not-allowed; }
  .status-pill { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  .status-ACTIVE { background: #e3f6e8; color: #1a7d3a; }
  .status-STALE { background: #fff4d9; color: #8a6300; }
  .status-REJECTED, .status-WITHDRAWN { background: #fbe4e4; color: #a01c1c; }
  .status-CLOSED { background: #eee; color: #555; }
  .status-UNKNOWN { background: #eef1f4; color: #555; }
  .empty { color: #888; font-style: italic; padding: 20px 0; }
  .err { color: #b00020; font-size: 13px; margin-top: 6px; }
  .toolbar { margin-bottom: 14px; }
  select#batch-select { padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; min-width: 320px; }
  .lane-title { font-size: 12px; text-transform: uppercase; color: #888; margin: 10px 0 4px; }
  .candidate { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .candidate:last-child { border-bottom: none; }
  .candidate label { flex: 1; cursor: pointer; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #eef1f4; color: #444; margin-left: 6px; }
  a { color: #1c5fb4; }
  .fu-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #ddd; border-radius: 6px; padding: 6px 12px; font-size: 13px; background: #fff; }
  .fu-chip b { font-size: 15px; }
  .fu-chip.overdue b { color: #a01c1c; }
  .fu-chip.today b { color: #8a6300; }
  .fu-chip.upcoming b { color: #1c5fb4; }
  .fu-chip.waiting b { color: #555; }
  table.fu-table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e1e4e8; border-radius: 6px; overflow: hidden; font-size: 13px; }
  table.fu-table th { text-align: left; padding: 8px 10px; background: #f5f6f8; border-bottom: 1px solid #e1e4e8; font-size: 11px; text-transform: uppercase; color: #666; }
  table.fu-table td { padding: 8px 10px; border-bottom: 1px solid #f0f0f0; }
  table.fu-table tr.fu-row { cursor: pointer; }
  table.fu-table tr.fu-row:hover { background: #f8f9fa; }
  .fu-due-OVERDUE { color: #a01c1c; font-weight: 600; }
  .fu-due-TODAY { color: #8a6300; font-weight: 600; }
  .fu-due-UPCOMING { color: #1c5fb4; }
  .fu-due-WAITING { color: #888; font-style: italic; }
  tr.fu-detail td { background: #f8f9fa; padding: 12px 16px; }
  .fu-detail-grid { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 4px 24px; margin-bottom: 10px; font-size: 13px; }
  .fu-detail-grid div span { color: #888; margin-right: 4px; }
  .card.highlight { outline: 2px solid #1c5fb4; outline-offset: 2px; }
  .status-form { margin-top: 10px; padding: 12px; background: #f8f9fa; border-radius: 4px; }
  .status-form .row { margin-bottom: 8px; }
  .status-form label { font-size: 12px; color: #666; width: 90px; flex-shrink: 0; }
  .status-form select, .status-form input[type="date"] { padding: 6px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
  .status-form textarea { flex: 1; min-width: 220px; padding: 6px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; font-family: inherit; }
  .completion-pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; margin-left: 8px; background: #eef1f4; color: #444; }
  .completion-COMPLETE { background: #e3f6e8; color: #1a7d3a; }
  .completion-IN_PROGRESS { background: #fff4d9; color: #8a6300; }
</style>
</head>
<body>
<header>
  <h1>CareerOps Operator</h1>
</header>
<nav>
  <button data-view="followup" class="active">Home</button>
  <button data-view="review">Review</button>
  <button data-view="ready">Ready to Apply</button>
  <button data-view="applications">Applications</button>
  <button data-view="outreach">Outreach</button>
</nav>
<main>
  <section id="view-review">
    <div class="toolbar row">
      <button class="action" id="add-job-btn">Add Job</button>
      <input type="url" id="add-job-url" placeholder="https://... job posting URL" style="display:none; flex: 1; min-width: 260px; padding: 6px 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px;">
      <button class="action primary" id="add-job-submit" style="display:none">Intake</button>
      <span id="add-job-status" class="meta"></span>
    </div>
    <div class="toolbar row">
      <label for="batch-select" class="meta">Review Batch:</label>
      <select id="batch-select"></select>
    </div>
    <div class="toolbar row">
      <button class="action primary" id="finalize-btn" disabled>Finalize Batch</button>
      <span id="finalize-hint" class="meta"></span>
    </div>
    <div id="review-list"></div>
  </section>

  <section id="view-ready">
    <div id="ready-list"></div>
  </section>

  <section id="view-applications">
    <div class="toolbar row">
      <button class="action selected" data-app-filter="alive" id="app-filter-alive">Alive</button>
      <button class="action" data-app-filter="all" id="app-filter-all">All</button>
      <button class="action" data-app-filter="closed" id="app-filter-closed">Closed</button>
    </div>
    <div id="applications-list"></div>
  </section>

  <section id="view-outreach">
    <div id="outreach-list"></div>
  </section>

  <section id="view-followup" class="active">
    <div class="row" id="followup-counts" style="margin-bottom:14px"></div>
    <div id="followup-list"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
